apiVersion: apps/v1
kind: Deployment
metadata:
  name: firevortex-chess-frontend
  labels:
    app: firevortex-chess
spec:
  replicas: 2
  selector:
    matchLabels:
      app: firevortex-chess
  template:
    metadata:
      labels:
        app: firevortex-chess
    spec:
      containers:
        - name: frontend
          image: firevortex-chess-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: firevortex-chess-service
spec:
  selector:
    app: firevortex-chess
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080